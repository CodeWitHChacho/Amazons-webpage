  <!-- Suppress browser-extension errors from appearing in the CRA dev overlay -->
  <script>
    (function () {
      var EXT = /(chrome|moz)-extension:\/\//i;
      var MSG = /(inpage\.js|inject\.js|chainId|only a getter|solana|wallet|phantom|metamask|enkrypt)/i;
      function shouldSuppress(event) {
        var parts = [
          event.filename, event.message,
          event.error && event.error.message,
          event.error && event.error.stack,
          event.reason && event.reason.message,
          event.reason && event.reason.stack
        ];
        return parts.some(function (s) {
          return s && (EXT.test(s) || MSG.test(s));
        });
      }
      window.addEventListener('error', function (e) {
        if (shouldSuppress(e)) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (shouldSuppress(e)) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
    })();
  </script>
